name: Bug
description: Something behaves wrongly.
labels: ["kind/bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it. Attach or link the book if it depends on one.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The npm package on a site
        - volumen.page
        - The desktop app
        - The sharing service
        - Building or testing the repository
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version, browser and operating system.
      placeholder: typeset.js 0.4.0, Safari 26, iOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output or error messages, if any.
      render: text
