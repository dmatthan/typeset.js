# The toolchains at the versions the repository pins (.node-version, rust-toolchain.toml,
# Cargo.lock), the Rust build cached. Needs the repository checked out.
name: Toolchains
description: Node, Rust and the wasm-bindgen CLI at the repository's pinned versions, and cargo-machete.
inputs:
  targets:
    description: Rust targets beyond the toolchain file's (space-separated).
    default: ""
  registry:
    description: The npm registry, for publishing.
    default: ""
  desktop:
    description: On Linux, the desktop app's system libraries (WebKitGTK; patchelf for its AppImage).
    default: "false"
  wasm-opt:
    description: On Linux, wasm-opt (binaryen), for the engine's release size.
    default: "false"
runs:
  using: composite
  steps:
    - name: System packages
      if: runner.os == 'Linux' && (inputs.desktop == 'true' || inputs.wasm-opt == 'true')
      shell: bash
      env:
        DESKTOP: "${{ inputs.desktop == 'true' && 'libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf' || '' }}"
        WASM_OPT: "${{ inputs.wasm-opt == 'true' && 'binaryen' || '' }}"
      run: sudo apt-get update && sudo apt-get install -y $DESKTOP $WASM_OPT
    - uses: actions/setup-node@v5
      with: { node-version-file: .node-version, registry-url: "${{ inputs.registry }}" }
    - name: Rust, as rust-toolchain.toml pins it
      shell: bash
      env: { TARGETS: "${{ inputs.targets }}" }
      run: |
        rustup toolchain install
        if [ -n "$TARGETS" ]; then rustup target add $TARGETS; fi
    - uses: Swatinem/rust-cache@v2
    - name: The wasm-bindgen CLI's version, from Cargo.lock
      shell: bash
      run: echo "WASM_BINDGEN=$(scripts/bindgen-version.sh)" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@v2
      with: { tool: "wasm-bindgen@${{ env.WASM_BINDGEN }},cargo-machete" }
