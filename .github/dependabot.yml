# Dependency updates, weekly: minor and patch versions grouped into one pull request per
# ecosystem, majors one by one; titled in the repository's convention (build(deps): …).
# Crates that must move together are a group of their own, at any version: harfrust reads
# fonts through read-fonts, and the press uses both, so they take one version of it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      fonts: { patterns: [harfrust, read-fonts] }
      cargo: { update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }
    labels: [kind/deps]
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups: { app: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(deps)" }
    labels: [kind/deps]
  - package-ecosystem: npm
    directory: /service
    schedule: { interval: weekly }
    groups: { service: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(deps)" }
    labels: [kind/deps, area/service]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { update-types: [minor, patch] } }
    commit-message: { prefix: "build(deps)" }
    labels: [kind/deps, kind/ci]
