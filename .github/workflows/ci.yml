# Every push and pull request: the gates a commit passes locally (scripts/lint.sh), the
# crates' tests, the browser tests (the app, its production build, the sharing service and
# the package on an ordinary site; then the reader in Firefox), and what a page with
# typeset.js downloads. Safari's engine is run by hand before a release (`test:webkit`):
# Playwright's WebKit loses a fresh page's first load to its network process crashing,
# a few tests in a long run, which loading the app alone never does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # the desktop shell's libraries (clippy builds it), and wasm-opt (the engine's size)
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev binaryen
      - run: scripts/build-wasm.sh
      - run: npm --prefix app ci && npm --prefix service ci
      - run: scripts/lint.sh
      - run: cargo test --workspace
      - run: (cd app && TYPESET_PACKAGE=1 npx vite build --logLevel warn) && node scripts/sizes.mjs
      - run: npx --prefix app playwright install --with-deps chromium firefox
      - run: npm --prefix app test
      - run: npm --prefix app run test:firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: app/test-results, retention-days: 7 }

  # the package's command on the oldest Node its `engines` allows
  package-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: packages/typeset.js }
      - id: floor
        run: echo "node=$(node -p "require('./packages/typeset.js/package.json').engines.node.replace(/[^0-9.]/g, '')")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with: { node-version: "${{ steps.floor.outputs.node }}" }
      - run: node packages/typeset.js/bin/typeset.mjs --help
