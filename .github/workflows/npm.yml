# typeset.js to npm, on a release tag `v<version>` (on a commit CI has passed: the release
# gate): the engine and the package's reader built, the package's tests run, then staged as npm's
# trusted publisher (this workflow, by name, is the one npm accepts: no token is kept
# anywhere, and npm records where each version was built). A staged version is public only
# once the owner approves it, with their own second factor: `npm stage list typeset.js`,
# then `npm stage approve <id>` (or on npmjs.com).
name: npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-gate
      - uses: ./.github/actions/setup
        with: { registry: "https://registry.npmjs.org" }
      # (staging came with npm 12)
      - run: npm install -g npm@12.2.3
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: scripts/build-wasm.sh
      - run: npm --prefix app ci && npm --prefix service ci
      - run: (cd app && TYPESET_PACKAGE=1 npx vite build --logLevel warn) && node scripts/sizes.mjs
      - run: npx --prefix app playwright install --with-deps chromium
      - run: (cd app && npx playwright test --project=package)
      - run: npm stage publish --access public
        working-directory: packages/typeset.js
