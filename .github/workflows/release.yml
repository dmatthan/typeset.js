# A release, for a tag `v<version>` (scripts/version.mjs) on a commit CI has passed: the
# desktop app for Linux, macOS and Windows and typeset.js.zip, attached under fixed names
# so https://github.com/dmatthan/typeset.js/releases/latest/download/<name> always gives
# the newest, with notes from the commits since the last release (cliff.toml). The npm
# package is staged from the same tag (npm.yml). By hand: a draft, for checking.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: github.ref_type == 'tag'
        uses: ./.github/actions/release-gate
      - uses: taiki-e/install-action@v2
        with: { tool: git-cliff }
      - run: |
          git cliff ${{ github.ref_type == 'tag' && '--latest' || '--unreleased' }} --strip all > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
        env: { GH_TOKEN: "${{ github.token }}" }

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, bundles: "deb,appimage", target: "" }
          - { os: macos-latest, bundles: "dmg", target: "universal-apple-darwin" }
          - { os: windows-latest, bundles: "nsis", target: "" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          targets: "${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}"
          desktop: "true"
      # the interface's engine for the web build (the app's types need it), then the app
      - run: scripts/build-wasm.sh
      - run: npm --prefix app ci
      - run: npx --prefix app tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Attach, under fixed names
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          out=target/${{ matrix.target }}/release/bundle
          [ -d "$out" ] || out=target/release/bundle
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)   cp "$out"/appimage/*.AppImage dist/Volumen-linux-x86_64.AppImage
                     cp "$out"/deb/*.deb dist/Volumen-linux-amd64.deb
                     # typeset.js without npm: the reader alone, to unpack into a folder of any site
                     (cd app && TYPESET_PACKAGE=1 npx vite build --logLevel warn)
                     mkdir -p zip/typeset && cp -r packages/typeset.js/reader/* zip/typeset/
                     (cd zip && zip -qr ../dist/typeset.js.zip typeset) ;;
            macOS)   cp "$out"/dmg/*.dmg dist/Volumen-macos.dmg ;;
            Windows) cp "$out"/nsis/*-setup.exe dist/Volumen-windows-x64-setup.exe ;;
          esac
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env: { GH_TOKEN: "${{ github.token }}" }
