# Release notes and CHANGELOG.md from the commit history (git-cliff): the squash-merged
# pull request titles, in the convention CONTRIBUTING.md describes, grouped by type.
#   npx git-cliff@2 --tag v0.4.0 -o CHANGELOG.md   the release commit's changelog
#   npx git-cliff@2 --latest --strip all          one release's notes

[changelog]
header = "# Changelog\n\nChanges since 0.3.0. Earlier changes are in the commit history.\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]"
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Structure" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build and CI" },
  { message = "^chore\\(repo\\): release", skip = true },
  { message = "^chore", group = "<!-- 8 -->Other" },
  # (anything else: not in the convention, so not in the notes)
  { message = ".*", skip = true },
]
