[package]
name = "typeset-engine"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"
serde = { workspace = true }
serde_json.workspace = true
unicode-normalization = "0.1"
typeset-ingest = { version = "0.1.0", path = "../ingest" }
typeset-model = { version = "0.1.0", path = "../model" }
typeset-press = { version = "0.1.0", path = "../press" }

[features]
parallel = ["dep:rayon"]

[lints]
workspace = true
